name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev

      - name: Build
        run: make

      - name: Install
        run: make PREFIX="livefetch-${GITHUB_REF_NAME}-linux-x86_64" install

      - name: Create archive
        run: |
          tar -czf \
            "livefetch-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" \
            "livefetch-${GITHUB_REF_NAME}-linux-x86_64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: "*.tar.gz"
        
  linux-aarch64:
    name: Linux aarch64
    runs-on: ubuntu-24.04-arm
  
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev

      - name: Build
        run: make

      - name: Install
        run: make PREFIX="livefetch-${GITHUB_REF_NAME}-linux-aarch64" install

      - name: Create archive
        run: |
          tar -czf \
            "livefetch-${GITHUB_REF_NAME}-linux-aarch64.tar.gz" \
            "livefetch-${GITHUB_REF_NAME}-linux-aarch64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: "*.tar.gz"

  macos-arm64:
    name: macOS arm64
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ncurses

      - name: Build
        run: make

      - name: Install
        run: make PREFIX="livefetch-${GITHUB_REF_NAME}-macos-arm64" install

      - name: Create archive
        run: |
          tar -czf \
            "livefetch-${GITHUB_REF_NAME}-macos-arm64.tar.gz" \
            "livefetch-${GITHUB_REF_NAME}-macos-arm64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: "*.tar.gz"

  macos-x86_64:
    name: macOS x86_64
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ncurses

      - name: Build
        run: | 
          make \
            CFLAGS="-Wall -Wextra -std=c17 -O2 -arch x86_64" \
            LDFLAGS="-arch x86_64 \
              -framework CoreFoundation \
              -framework IOKit \
              -framework CoreGraphics \
              -framework CoreDisplay"

      - name: Install
        run: make PREFIX="livefetch-${GITHUB_REF_NAME}-macos-x86_64" install

      - name: Create archive
        run: |
          tar -czf \
            "livefetch-${GITHUB_REF_NAME}-macos-x86_64.tar.gz" \
            "livefetch-${GITHUB_REF_NAME}-macos-x86_64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: "*.tar.gz"

  release:
    name: Create GitHub Release
    needs:
      - linux-x86_64
      - linux-aarch64
      - macos-arm64
      - macos-x86_64

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: '*'
          merge-multiple: true

      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.tar.gz
          generate_release_notes: true