name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev

      - name: Build
        run: make

      - name: Install
        run: make PREFIX="livefetch-${GITHUB_REF_NAME}-linux-x86_64" install

      - name: Create archive
        run: |
          tar -czf \
            "livefetch-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" \
            "livefetch-${GITHUB_REF_NAME}-linux-x86_64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: "*.tar.gz"
        
  linux-aarch64:
    name: Linux aarch64
    runs-on: ubuntu-24.04-arm
  
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev

      - name: Build
        run: make

      - name: Install
        run: make PREFIX="livefetch-${GITHUB_REF_NAME}-linux-aarch64" install

      - name: Create archive
        run: |
          tar -czf \
            "livefetch-${GITHUB_REF_NAME}-linux-aarch64.tar.gz" \
            "livefetch-${GITHUB_REF_NAME}-linux-aarch64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: "*.tar.gz"

  macos-arm64:
    name: macOS arm64
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ncurses

      - name: Build
        run: make

      - name: Install
        run: make PREFIX="livefetch-${GITHUB_REF_NAME}-macos-arm64" install

      - name: Create archive
        run: |
          tar -czf \
            "livefetch-${GITHUB_REF_NAME}-macos-arm64.tar.gz" \
            "livefetch-${GITHUB_REF_NAME}-macos-arm64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: "*.tar.gz"

  macos-x86_64:
    name: macOS x86_64
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ncurses

      - name: Build
        run: | 
          make \
            CFLAGS="-Wall -Wextra -std=c17 -O2 -arch x86_64" \
            LDFLAGS="-arch x86_64 \
              -framework CoreFoundation \
              -framework IOKit \
              -framework CoreGraphics \
              -framework CoreDisplay"

      - name: Install
        run: make PREFIX="livefetch-${GITHUB_REF_NAME}-macos-x86_64" install

      - name: Create archive
        run: |
          tar -czf \
            "livefetch-${GITHUB_REF_NAME}-macos-x86_64.tar.gz" \
            "livefetch-${GITHUB_REF_NAME}-macos-x86_64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: "*.tar.gz"

  release:
    name: Create GitHub Release
    needs:
      - linux-x86_64
      - linux-aarch64
      - macos-arm64
      - macos-x86_64

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: '*'
          merge-multiple: true

      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.tar.gz
          generate_release_notes: true

  update-homebrew:
    name: Update Homebrew Formula
    needs:
      - release

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: WilGulf/homebrew-livefetch
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Calculate SHA256
        id: sha256
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/WilGulf/livefetch/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"

          SHA256=$(curl -L "$URL" | sha256sum | cut -d ' ' -f1)

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT" 

      - name: Update formula
        run: |
          URL="${{ steps.sha256.outputs.url }}"
          SHA256="${{ steps.sha256.outputs.sha256 }}"

          sed -i \
            -e "s|^  url \".*\"|  url  \"$URL\"|" \
            -e "s|^ sha256 \".*\"| sha256 \"$SHA256\"|" \
            Formula/livefetch.rb

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add Formula/livefetch.rb
          
          git commit \
            -m "Update livefetch to ${{ github.ref_name }}"
          
          git push

  update-linux-repos:
    name: Update Linux Repositories
    needs:
      - release

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    steps:
      - name: Download linux artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*linux-*'
          merge-multiple: true

      - name: Extract artifacts
        run: |
          mkdir -p extracted
          tar -xzf artifacts/livefetch-${GITHUB_REF_NAME}-linux-x86_64.tar.gz -C extracted
          tar -xzf artifacts/livefetch-${GITHUB_REF_NAME}-linux-aarch64.tar.gz -C extracted

      - name: Install packaging tools
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt update
          sudo apt install nfpm createrepo-c -y

      - name: Build .deb and .rpm packages
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION_NUM="${VERSION#v}"
          mkdir -p dist
          
          for ARCH_PAIR in "x86_64:amd64:x86_64" "aarch64:arm64:aarch64"; do
            IFS=':' read -r DIRARCH DEBARCH RPMARCH <<< "$ARCH_PAIR"
            SRC="extracted/livefetch-${VERSION}-linux-${DIRARCH}"
 
            cat > nfpm-${DIRARCH}.yaml << EOF
          name: "livefetch"
          arch: "${DEBARCH}"
          platform: "linux"
          version: "${VERSION_NUM}"
          section: "utils"
          priority: "optional"
          maintainer: "WilGulf <245902168+WilGulf@users.noreply.github.com>"
          description: "TUI system information tool with live-updating modules"
          homepage: "https://github.com/WilGulf/livefetch"
          license: "MIT"
          contents:
            - src: ${SRC}/bin/livefetch
              dst: /usr/bin/livefetch
              file_info:
                mode: 0755
            - src: ${SRC}/share/livefetch/default.conf
              dst: /usr/share/livefetch/default.conf
              file_info:
                mode: 0644
            - src: ${SRC}/share/livefetch/logos
              dst: /usr/share/livefetch/logos/
              file_info:
                mode: 0644
          deb:
            compression: xz
          rpm:
            compression: xz
          EOF

            nfpm package --config nfpm-${DIRARCH}.yaml --packager deb --target ./dist/livefetch_${VERSION_NUM}_${DEBARCH}.deb
            nfpm package --config nfpm-${DIRARCH}.yaml --packager rpm --target ./dist/livefetch-${VERSION_NUM}.${RPMARCH}.rpm
          done

      - name: Upload packages as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*

      - name: Checkout rpm repo
        uses: actions/checkout@v4
        with:
          repository: WilGulf/rpm-livefetch
          ref: main
          path: rpm-repo
          token: ${{ secrets.REPO_PUBLISH_TOKEN }}

      - name: Update rpm repodata
        run: |
          cd rpm-repo
          mkdir -p x86_64 aarch64
          cp ../dist/livefetch-*.x86_64.rpm x86_64/
          cp ../dist/livefetch-*.aarch64.rpm aarch64/

          createrepo_c x86_64
          createrepo_c aarch64

      - name: Open PR with updated repodata
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.REPO_PUBLISH_TOKEN }}
          path: rpm-repo
          branch: release-${{ github.ref_name }}
          base: main
          title: "Publish livefetch ${{ github.ref_name }}"
          body: |
            Auto-generated by CI: adds livefetch ${{ github.ref_name }} .rpm packages
            and regenerates repodata via createrepo_c.
 
            **Not yet signed.** Before merging:
            - `gpg --detach-sign --armor x86_64/repodata/repomd.xml`
            - `gpg --detach-sign --armor aarch64/repodata/repomd.xml`
            - commit the `.asc` files to this branch, then merge.
          commit-message: "Add livefetch ${{ github.ref_name }} rpm packages + repodata (unsigned)"
          delete-branch: true

            

          
          
